# Carnivores 2: everything in one game: Carnivores 2 on the Modder's Edition, the 13 standalone games beside it (each with its own areas and animals), every add-on of c2-everything.toml and both mobile games' animals (from your APKs).
#
# Credits, download pages and file hashes only; no game or mod files.
# Download each mod and game from its page and unpack each into its own folder.
# Two games come in one download (P.Rex's last update): give its `Carnivores Triassic`
# and `Mandibles` folders. The launcher's Add-ons tab takes this file (drop it in) and
# asks for each folder; on the command line, --mods is repeatable (a downloads folder,
# or one mod's folder). Only the files listed here are used. See docs/MODDING.md.
#
# Modder's Edition 1.1.1: https://www.moddb.com/mods/carnivores-modders-edition/downloads/carnivores-modders-edition-111
#   ME="PATH/Carnivores Modders Edition 1.1.1 Standalone/Carnivores 2"
#   c2-pc recipe verify THIS.toml --base C2 --overlay "$ME" --mods DOWNLOADS
#   c2-pc recipe build  THIS.toml --base C2 --overlay "$ME" --mods DOWNLOADS --out GAME
#
# 3DS pack (one pack; Old 3DS: --target o3ds), into sdmc:/3ds/<install>/:
#   c2-cook --game GAME --mobile-survival DOWNLOADS/dinosaur-hunter/mobile-survival.txt --target o3ds --force --out <install>.c2pk
#
# The mobile games' animals are made from your own APK (never shared):
#   c2-pc mobile DINOSAUR_HUNTER.apk --base C2 --overlay "$ME" --out DOWNLOADS/dinosaur-hunter
#   c2-pc mobile ICE_AGE.apk        --base C2 --overlay "$ME" --out DOWNLOADS/ice-age
#

