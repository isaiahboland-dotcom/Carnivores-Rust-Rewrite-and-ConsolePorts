# Carnivores 2 + Android: Carnivores 2 on the Modder's Edition with the mobile Dinosaur Hunter's
# animals and classic survival (from your APK).
#
# Credits, download pages and file hashes only; no game or mod files.
# Download each mod from its page, unpack each into its own folder under
# one DOWNLOADS folder, and point --mods at it. See docs/MODDING.md.
# Fill in the TODO credits and links before sharing this file.
#
#   ME="PATH/Carnivores Modders Edition 1.1.1 Standalone/Carnivores 2"
#   c2-pc recipe verify THIS.toml --base C2 --overlay "$ME" --mods DOWNLOADS
#   c2-pc play C2 --overlay "$ME" --recipe THIS.toml --mods DOWNLOADS
#
# 3DS pack (Old 3DS: --target o3ds), then copy it to sdmc:/3ds/<install>/:
#   c2-cook --game C2 --overlay "$ME" --mod DOWNLOADS/dinosaur-hunter --mobile-survival DOWNLOADS/dinosaur-hunter/mobile-survival.txt --target o3ds --out <install>.c2pk
#
# The mobile games' animals are made from your own APK (never shared):
#   c2-pc mobile DINOSAUR_HUNTER.apk --base C2 --overlay "$ME" --out DOWNLOADS/dinosaur-hunter
#   c2-pc mobile ICE_AGE.apk        --base C2 --overlay "$ME" --out DOWNLOADS/ice-age
# (for the Ice Age base game: --base ICE_AGE and no overlay). The Dinosaur
# Hunter import also writes mobile-survival.txt: the classic survival.
#

[recipe]
id = "c2-android"
name = "Carnivores 2 + Android"
version = "0.1"
base = "c2-vanilla"

[[mods]]
id = "dinosaur-hunter"
credit = "TODO: your own APK import (see above)"
url = "none: made from your own APK"
loose = true

