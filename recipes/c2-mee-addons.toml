# Ten add-on animals for Carnivores 2 on the Modder's Edition Engine 1.1.1, as
# loose add-ons. This file holds credits, download pages and file hashes only:
# download each add-on from its page (unpack it into its own folder under one
# downloads folder) and get the Modder's Edition yourself. See docs/MODDING.md.
#
#   ME="PATH/Carnivores Modders Edition 1.1.1 Standalone/Carnivores 2"
#   c2-pc recipe verify ../recipes/c2-mee-addons.toml --base ../source/c2-original --overlay "$ME" --mods DOWNLOADS
#   c2-pc play ../source/c2-original --overlay "$ME" --recipe ../recipes/c2-mee-addons.toml --mods DOWNLOADS
#
# Each mod's files are listed by their path inside its download. With the
# Modder's Edition overlay, the c2-vanilla base check reports the files the
# overlay changes; that is expected.

[recipe]
id = "c2-mee-addons"
name = "Carnivores 2: Modder's Edition add-ons"
version = "0.1"
base = "c2-vanilla"

