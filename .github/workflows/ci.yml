name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  pc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-ver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sound (kira / cpal: ALSA) and gamepads (gilrs: udev).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pc-ver
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features

  # Keeps the shared format crate portable to the 3DS target.
  formats-3ds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-ver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: rust-src
      - run: cargo build -p c2-formats --target armv6k-nintendo-3ds -Z build-std=std,panic_abort

  cooker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3ds-ver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo +stable test --locked -p c2-cook
      - run: cargo +stable build --locked --release -p c2-cook

  wiiu-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and run portable C tests
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          for source in wiiu-ver/perf-probe/tests/*_test.c; do
            binary="$output/$(basename "${source%.c}")"
            cc -std=c11 -Wall -Wextra -UNDEBUG "$source" -lm -o "$binary"
            "$binary"
          done
