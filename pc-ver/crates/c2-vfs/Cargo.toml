[package]
name = "c2-vfs"
description = "Layered, case-insensitive virtual filesystem with provenance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["thiserror/std", "c2-formats/std"]
# Zip archives as layers (mods often ship zipped). Off for the 3DS.
zip = ["std", "dep:zip"]

[dependencies]
thiserror = { version = "2", default-features = false }
zip = { workspace = true, optional = true }
c2-formats = { path = "../c2-formats", default-features = false }
