[package]
name = "c2-pc"
description = "PC backend and binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
c2-core.workspace = true
c2-platform.workspace = true
c2-formats.workspace = true
c2-mods.workspace = true
c2-vfs.workspace = true
c2-pad.workspace = true
png.workspace = true
toml.workspace = true
wgpu.workspace = true
winit.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
kira.workspace = true
font8x8.workspace = true

# Android (android-ver/): the game's own loop on the activity (app_android.rs);
# winit still needs an activity backend to build there, and gives the key types.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
raw-window-handle = "0.6"
