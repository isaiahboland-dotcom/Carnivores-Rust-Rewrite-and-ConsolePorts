[package]
name = "c2-core"
description = "Platform-independent Carnivores 2 game logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The full game remains the default; the portable subset is an early console step.
default = ["std"]
std = ["dep:thiserror", "dep:tracing", "c2-formats/std", "dep:c2-platform", "dep:c2-vfs", "c2-vfs/std"]
# Enables the shared dinosaur simulation on allocation-capable no_std targets.
portable-dino = []
portable-hunt = ["portable-dino"]
hunt-diagnostics = ["portable-hunt"]
# Loading a hunt through a VFS (`load`) and Modder's Edition game folders
# (`mee`) on no_std targets (the Wii U reads game folders from its SD card).
portable-load = ["portable-hunt", "dep:c2-vfs"]

[dependencies]
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
c2-formats = { path = "../c2-formats", default-features = false }
libm = "0.2"
c2-platform = { workspace = true, optional = true }
# By path: the workspace entry turns on its `std`, which `std` above adds.
c2-vfs = { path = "../c2-vfs", default-features = false, optional = true }

[[example]]
name = "face_flags"
required-features = ["std"]

[[example]]
name = "pick_probe"
required-features = ["std"]

[[example]]
name = "res_cost"
required-features = ["std"]

# The Wii U menu's host tests (wiiu_menu.rs) draw it as the console does.
[dev-dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
font8x8.workspace = true
png.workspace = true
