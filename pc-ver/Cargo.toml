[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
c2-formats = { path = "crates/c2-formats" }
c2-vfs = { path = "crates/c2-vfs" }
c2-mods = { path = "crates/c2-mods" }
c2-core = { path = "crates/c2-core" }
c2-platform = { path = "crates/c2-platform" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0.1"
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.4"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
