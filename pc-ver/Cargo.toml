[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
c2-formats = { path = "crates/c2-formats" }
c2-vfs = { path = "crates/c2-vfs" }
c2-mods = { path = "crates/c2-mods" }
c2-core = { path = "crates/c2-core" }
c2-platform = { path = "crates/c2-platform" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
